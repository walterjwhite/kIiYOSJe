<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">◆</span> mind
    </div>
    <nav class="topbar-nav">
      <button class="nav-tab active" data-view="queue">Work Queue</button>
      <button class="nav-tab" data-view="plan">Today's Plan</button>
      <button class="nav-tab" data-view="log">Signals Log</button>
    </nav>
    <div class="topbar-right">
      <button class="chip-btn" id="pause-chip">
        <span class="chip-dot running"></span> Running
      </button>
      <button class="chip-btn" id="ai-chip">
        <span class="chip-icon">◧</span> ollama
      </button>
    </div>
  </header>

  <!-- Queue view: list + detail -->
  <main class="view-queue" id="view-queue">
    <div class="queue-pane">
      <div class="queue-pane-header">
        <div class="queue-pane-title">Work Queue</div>
        <div class="segmented">
          <button class="segmented-btn active" data-sort="urgency">Urgency</button>
          <button class="segmented-btn" data-sort="flow">Flow</button>
        </div>
      </div>
      <div class="queue-list" id="queue-list"></div>
    </div>
    <div class="detail-pane" id="detail-pane">
      <div class="detail-empty">
        <div class="detail-empty-mark">◆</div>
        <p>Select an item from the queue.</p>
      </div>
    </div>
  </main>

  <!-- Today's Plan view -->
  <main class="view-plan hidden" id="view-plan">
    <div class="plan-scroll" id="plan-scroll"></div>
  </main>

  <!-- Signals Log view -->
  <main class="view-log hidden" id="view-log">
    <div class="log-toolbar">
      <div class="log-filter-group">
        <label>Channel</label>
        <select id="log-channel-filter">
          <option value="all">All channels</option>
          <option value="email">Email</option>
          <option value="chat">Chat</option>
          <option value="jira">Jira</option>
          <option value="calendar">Calendar</option>
          <option value="sms">SMS</option>
        </select>
      </div>
      <div class="log-filter-group">
        <label>Direction</label>
        <select id="log-direction-filter">
          <option value="all">In &amp; out</option>
          <option value="in">Inbound</option>
          <option value="out">Outbound</option>
        </select>
      </div>
      <div class="log-count" id="log-count"></div>
    </div>
    <div class="log-list" id="log-list"></div>
  </main>

</div>

<!-- Command palette overlay (AI provider picker) -->
<div class="overlay hidden" id="command-palette-overlay">
  <div class="quick-pick">
    <input type="text" class="quick-pick-input" id="ai-provider-search" placeholder="Select AI provider / model">
    <div class="quick-pick-list" id="ai-provider-list"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
