name: Agent intake

# An issue is eligible for an AI agent only when a maintainer applies `ai-ready`
# and the issue has acceptance criteria. Issue text is untrusted data: this
# workflow only reads it with github-script and never executes it. When the
# checks pass it starts gemini-agent.yml (workflow_dispatch needs no extra token)
# and passes a hash of the approved issue body, so an edit after approval stops the run.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read
  actions: write

jobs:
  check:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          GEMINI_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
        with:
          script: |
            const crypto = require("node:crypto");
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const actor = context.payload.sender.login;

            const reject = async (reason) => {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: "ai-ready" }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Removed \`ai-ready\`: ${reason}`,
              });
            };

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
            if (!["admin", "maintain"].includes(perm.data.permission)) {
              return reject(`@${actor} is not a maintainer. Only maintainers can mark an issue as ready for an agent.`);
            }

            const body = context.payload.issue.body ?? "";
            const hasCriteria = /acceptance criteria/i.test(body) && /- \[[ x]\]/i.test(body);
            if (!hasCriteria) {
              return reject("the issue needs an **Acceptance criteria** section with at least one checkbox.");
            }
            const labels = context.payload.issue.labels.map((l) => l.name);
            if (labels.includes("needs-human-decision") || labels.includes("security")) {
              return reject("issues labelled `needs-human-decision` or `security` are not eligible for an agent.");
            }

            if (process.env.GEMINI_CONFIGURED !== "true") {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: "This issue passed the checks, but the `GEMINI_API_KEY` repository secret is not set, so no agent was started. Add it (see `.kiro/steering/workflow.md`), then run the **Gemini agent** workflow with this issue number.",
              });
              return;
            }

            const bodySha = crypto.createHash("sha256").update(body).digest("hex");
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: "gemini-agent.yml",
              ref: context.payload.repository.default_branch,
              inputs: { issue_number: String(number), body_sha256: bodySha },
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                "Ready for an agent. The **Gemini agent** workflow was started for this issue. It will open a draft PR from an `agent/` branch, or comment here if it cannot.",
                "Do not edit the issue body while it runs; an edit stops the run and you would need to re-apply `ai-ready`.",
                "Gates before merge: `ci-pass`, `agent-guard`, Security, and a human approval. See AGENTS.md.",
              ].join("\n\n"),
            });
