name: Agent intake

# An issue is eligible for an AI agent only when a maintainer applies `ai-ready`
# and the issue has acceptance criteria. Issue text is untrusted data: this
# workflow only reads it with github-script and never executes it.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          # Optional. A fine-grained PAT (actions, contents, issues, pull requests: write,
          # metadata: read) owned by a maintainer. Leave unset to assign Copilot by hand.
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const actor = context.payload.sender.login;

            const reject = async (reason) => {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: "ai-ready" }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Removed \`ai-ready\`: ${reason}`,
              });
            };

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
            if (!["admin", "maintain"].includes(perm.data.permission)) {
              return reject(`@${actor} is not a maintainer. Only maintainers can mark an issue as ready for an agent.`);
            }

            const body = context.payload.issue.body ?? "";
            const hasCriteria = /acceptance criteria/i.test(body) && /- \[[ x]\]/i.test(body);
            if (!hasCriteria) {
              return reject("the issue needs an **Acceptance criteria** section with at least one checkbox.");
            }
            const labels = context.payload.issue.labels.map((l) => l.name);
            if (labels.includes("needs-human-decision") || labels.includes("security")) {
              return reject("issues labelled `needs-human-decision` or `security` are not eligible for an agent.");
            }

            const token = process.env.COPILOT_ASSIGN_TOKEN;
            let assigned = false;
            if (token) {
              // Assigning Copilot needs a user token; GITHUB_TOKEN cannot do it.
              const user = github.getOctokit(token);
              try {
                await user.request("POST /repos/{owner}/{repo}/issues/{issue_number}/assignees", {
                  owner, repo, issue_number: number,
                  assignees: ["copilot-swe-agent[bot]"],
                  agent_assignment: {
                    target_repo: `${owner}/${repo}`,
                    base_branch: context.payload.repository.default_branch,
                    custom_instructions:
                      "Follow AGENTS.md and .github/copilot-instructions.md. Put 'Closes #" + number + "' in the PR description. Stay within the issue's acceptance criteria.",
                    custom_agent: "",
                    model: "",
                  },
                });
                assigned = true;
              } catch (e) {
                core.warning(`Could not assign Copilot: ${e.status ?? ""} ${e.message}`);
              }
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                assigned
                  ? "Ready for an agent. Assigned to Copilot cloud agent; it will open a draft PR from a `copilot/` branch."
                  : "Ready for an agent. Assign **Copilot** to this issue (Assignees, or the Agents tab) to start it. Automatic assignment is off until the `COPILOT_ASSIGN_TOKEN` secret is set.",
                "Gates before merge: `ci-pass`, `agent-guard`, Security, a maintainer clicking **Approve and run workflows**, and a human approval (the person who assigned Copilot cannot approve its PR). See AGENTS.md.",
              ].join("\n\n"),
            });
