name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on the `release` environment so a human approves every release.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          for f in package.json extension/package.json; do
            got=$(node -p "require('./$f').version")
            [ "$got" = "$v" ] || { echo "$f is $got, tag is $v"; exit 1; }
          done
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

      - name: Build
        run: |
          npx tsc --build packages/core packages/pipeline packages/server packages/cli
          bash scripts/build-extension.sh --no-build

      - name: Server artifact and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          tar czf "out/mind-server-${TAG}.tgz" \
            packages/*/dist packages/*/package.json packages/core/migrations \
            package.json package-lock.json LICENSE
          cp extension/*.vsix out/
          npm sbom --sbom-format cyclonedx --omit=dev > "out/mind-${TAG}.sbom.cdx.json"
          (cd out && sha256sum * > SHA256SUMS)

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - name: Publish GitHub release (draft until a human publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" out/* --draft --title "$TAG" --notes-file notes.md
