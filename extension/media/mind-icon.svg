<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Simple monochrome mark for the Activity Bar: a filled circle (focus / attention) with
       a small satellite dot (a signal arriving) — matches VS Code's convention of a flat,
       single-color icon that the theme recolors automatically. -->
  <circle cx="11" cy="12" r="7" fill="#ffffff"/>
  <circle cx="19" cy="6" r="2.4" fill="#ffffff"/>
</svg>
